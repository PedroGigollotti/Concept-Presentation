<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Concept Team · Concept</title>
<meta name="description" content="Meet the Concept team: six AI coaches built on the Concept method who work with your people between lessons. Take the 5-question test.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Instrument+Sans:ital,wght@0,400;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000; --panel:#0B0B0B; --white:#fff;
    --red:#E32F2E; --red-hi:#FF4342;
    --gray:#8A8F98; --gray-dark:#4A4E57; --silver:#E4E6EA;
    --line-dark:rgba(228, 230, 234, 0.12); --line-light:rgba(0,0,0,.09);
    --sans:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
    --serif:'Instrument Serif',Georgia,serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:#000;color:#000;font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  a{color:inherit;}
  em,i{font-family:var(--serif);font-style:italic;color:var(--red);}

  /* ===== NAV (identical to Home) ===== */
  #nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;
    justify-content:space-between;gap:12px;padding:16px 32px;
    background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line-dark);}
  #nav .brand{display:flex;align-items:center;gap:14px;text-decoration:none;}
  #nav .brand svg{height:28px;width:auto;overflow:visible;transition:transform .35s ease;}
  #nav .wordmark{color:#B3132B;font-family:'Carlito','Calibri','Lato',var(--sans);font-weight:700;font-size:16px;letter-spacing:.43em;}
  .nav-right{display:flex;align-items:center;gap:12px;z-index:105;}
  .nav-link{color:var(--silver);font-family:var(--sans);font-weight:600;font-size:13px;
    text-decoration:none;letter-spacing:.5px;opacity:.85;transition:opacity .22s ease;}
  .nav-link:hover,.nav-link:focus-visible{opacity:1;color:var(--red);}
  .lang-switch{display:flex;gap:3px;background:rgba(255,255,255,.07);border-radius:999px;padding:4px;}
  .lang-switch button{background:none;border:none;color:var(--silver);font-family:var(--sans);
    font-weight:600;font-size:11px;padding:7px 11px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    -webkit-tap-highlight-color:rgba(227,47,46,.3);touch-action:manipulation;transition:all .22s ease;}
  .lang-switch button.active{background:var(--red);color:#fff;}
  .lang-switch .flag-chip{width:15px;height:15px;border-radius:50%;overflow:hidden;flex:0 0 auto;display:block;
    -webkit-mask-image:radial-gradient(circle, #000 55%, transparent 100%);
    mask-image:radial-gradient(circle, #000 55%, transparent 100%);}
  .lang-switch .flag-chip svg{width:100%;height:100%;display:block;}
  #nav .cta{background:var(--red);color:#fff;border:none;border-radius:999px;padding:10px 20px;
    font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;
    display:inline-flex;align-items:center;
    touch-action:manipulation;transition:transform .18s ease,background .22s ease,box-shadow .22s ease;}
  #nav .cta:hover{background:var(--red-hi);transform:translateY(-2px);box-shadow:0 8px 22px rgba(227,47,46,.4);}
  @media (max-width:760px){
    #nav{padding:12px 16px;}
    #nav .wordmark{display:none;}
    #nav .cta{padding:9px 14px;font-size:12px;}
    .lang-switch button{padding:9px 11px;font-size:11px;}
  }

  /* ===== LAYOUT ===== */
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
  .bg-black{background:#000;color:#fff;}
  .bg-white{background:#fff;color:#000;}
  .section-pad{padding:96px 0;}
  @media (max-width:760px){.section-pad{padding:64px 0;} .wrap{padding:0 20px;}}

  .kicker{font-size:11.5px;font-weight:600;letter-spacing:3px;color:var(--red);margin:0 0 18px;}
  h1.name{font-weight:400;margin:0 0 8px;font-size:clamp(36px,6vw,64px);line-height:1.05;letter-spacing:-.02em;color:#fff;}
  h2.headline{font-weight:400;margin:0 0 22px;font-size:clamp(24px,3.6vw,42px);line-height:1.12;letter-spacing:-.02em;}
  .lede{font-size:clamp(15.5px,1.5vw,18.5px);line-height:1.6;color:var(--gray-dark);max-width:680px;}
  .lede.on-dark{color:var(--silver);}
  .body-copy{font-size:15.5px;line-height:1.68;color:var(--gray-dark);}
  .body-copy.on-dark{color:var(--silver);}

  .btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--sans);
    font-weight:600;font-size:15px;padding:15px 28px;border-radius:999px;border:1.5px solid currentColor;
    cursor:pointer;background:none;touch-action:manipulation;
    transition:transform .2s ease,background .25s ease,color .25s ease,box-shadow .25s ease;}
  .btn-solid{background:var(--red);border-color:var(--red);color:#fff;}
  .btn-solid:hover{background:var(--red-hi);transform:translateY(-3px);box-shadow:0 12px 30px rgba(227,47,46,.38);}
  .btn-outline{color:#fff;}
  .btn-outline:hover{background:#fff;color:#000;transform:translateY(-3px);}
  .cta-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:38px;}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.25,1,.25,1),transform .8s cubic-bezier(.25,1,.25,1);}
  .reveal.visible{opacity:1;transform:translateY(0);}
  .reveal-scale{opacity:0;transform:scale(.95);transition:opacity .75s ease,transform .75s cubic-bezier(.25,1,.25,1);}
  .reveal-scale.visible{opacity:1;transform:scale(1);}
  @media (prefers-reduced-motion:reduce){.reveal,.reveal-scale{opacity:1!important;transform:none!important;transition:none;}}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:44px;}
  @media (max-width:760px){.two-col{grid-template-columns:1fr;gap:22px;}}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media (max-width:900px){.grid-3{grid-template-columns:1fr;}}

  .card{background:var(--panel);border:1px solid var(--line-dark);border-radius:26px;padding:34px;color:#fff;
    transition:transform .35s cubic-bezier(.25,1,.25,1),box-shadow .35s ease,border-color .35s ease;}
  .card:hover{transform:translateY(-8px);border-color:rgba(227,47,46,.35);}
  .card h3{font-weight:600;font-size:19px;margin:0 0 12px;line-height:1.3;}
  .card p{margin:0;font-size:14.5px;line-height:1.62;color:var(--silver);}

  #stats{padding:80px 0 96px;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:42px;}
  .stat-num{font-size:clamp(34px,5vw,58px);letter-spacing:-.02em;color:#fff;line-height:1;}
  .stat-num .accent{color:var(--red);font-family:var(--serif);font-style:italic;}
  .stat-label{margin-top:12px;font-size:13.5px;color:#8D929B;line-height:1.5;}
  @media (max-width:760px){.stat-grid{grid-template-columns:1fr;gap:32px;}}

  .trust{padding:52px 0;border-top:1px solid var(--line-dark);border-bottom:1px solid var(--line-dark);}
  .trust-label{font-size:11px;letter-spacing:2.5px;color:#6E727A;text-align:center;margin-bottom:22px;}
  .trust-row{display:flex;gap:44px;justify-content:center;align-items:center;flex-wrap:wrap;}
  .trust-row span{font-size:clamp(15px,2vw,21px);font-weight:600;color:#fff;opacity:.72;letter-spacing:.5px;}

  .quote-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:44px;}
  @media (max-width:980px){.quote-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:700px){.quote-grid{grid-template-columns:1fr;}}
  .quote{background:#fff;border:1px solid var(--line-light);border-radius:24px;padding:30px;display:flex;flex-direction:column;
    transition:transform .35s cubic-bezier(.25,1,.25,1),box-shadow .35s ease,border-color .35s ease;}
  .quote:hover{transform:translateY(-7px);box-shadow:0 20px 44px rgba(0,0,0,.09);border-color:rgba(227,47,46,.3);}
  .quote .qm{font-family:var(--serif);font-style:italic;font-size:44px;color:var(--red);line-height:.8;margin-bottom:12px;}
  .quote p{margin:0 0 22px;font-size:14.5px;line-height:1.65;color:var(--gray-dark);flex:1;}
  .quote .who{font-weight:600;font-size:14px;color:#000;}
  .quote .role{font-size:12.5px;color:#8A8F98;margin-top:3px;line-height:1.4;}

  footer{padding:34px 0 44px;border-top:1px solid var(--line-dark);}
  .footrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
    gap:14px;font-size:11.5px;color:#7E838C;}
  .footrow .fl{display:flex;align-items:center;gap:11px;}
  .footrow svg{height:24px;width:auto;overflow:visible;}
  .needle{transform-origin:200px 200px;}
  @keyframes tickTock{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  /* ===== TEAM PAGE ===== */
  .nav-link.on{color:#fff;opacity:1;border-bottom:1px solid var(--red);padding-bottom:2px;}
  .group{margin-top:56px;background:#000;border-radius:22px;overflow:hidden;}
  .group img{display:block;width:100%;height:auto;}
  .test-intro{max-width:760px;padding:40px 0 10px;border-top:1px solid var(--line-dark);}
  .member{padding:70px 0;}
  .mgrid{display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;align-items:center;}
  .member.flip .mfig{order:2;}
  .mgrid>*{min-width:0;}
  .mfig{position:relative;background:#000;border-radius:22px;display:flex;justify-content:center;align-items:flex-end;}
  .mfig video{display:block;width:100%;max-width:460px;height:auto;aspect-ratio:720/1010;background:#000;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 12%,#000 92%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 12%,#000 92%,transparent 100%);mask-composite:intersect;}
  .mname{font-family:var(--serif);font-weight:400;font-size:clamp(46px,6vw,76px);line-height:.95;margin:0 0 14px;color:#fff;}
  .hear{position:absolute;left:18px;bottom:18px;z-index:3;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:9px 15px 9px 12px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,border-color .2s;}
  .hear svg{width:16px;height:16px;}
  .hear:hover{background:var(--red);border-color:var(--red);}
  .hear.playing{background:var(--red);border-color:var(--red);}
  .hear:focus-visible,.sound:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
  .sound{gap:10px;}
  .sound svg{width:18px;height:18px;}
  .sound .w{opacity:.35;}
  .sound[aria-pressed="true"]{background:#fff;color:#000;}
  .sound[aria-pressed="true"] .w{opacity:1;}
  .bballoon{position:absolute;z-index:4;right:60%;max-width:230px;width:max-content;display:grid;gap:1px;text-align:right;background:#fff;color:#0A0B0D;border-radius:14px 14px 4px 14px;padding:6px 11px 7px;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:bpop .26s cubic-bezier(.2,.8,.2,1) both;transition:opacity .4s,transform .4s;}
  .bballoon .bl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#8A8F98;}
  .bballoon .bt{font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.2;}
  .bballoon.en{box-shadow:0 0 0 1.5px var(--red) inset,0 12px 30px rgba(0,0,0,.45);}
  .bballoon.out{opacity:0;transform:translateY(-6px);}
  @keyframes bpop{from{opacity:0;transform:scale(.6) translateX(14px)}to{opacity:1;transform:none}}
  .closing{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:56px;align-items:center;border-top:1px solid var(--line-dark);padding-top:56px;}
  .closing>*{min-width:0;}
  .cfilm{position:relative;border-radius:22px;overflow:hidden;background:#000;}
  .cfilm video{display:block;width:100%;height:auto;aspect-ratio:9/16;object-fit:cover;}
  @media (max-width:860px){.closing{grid-template-columns:1fr;gap:28px;}.cfilm{max-width:300px;margin:0 auto;}}
  .mline{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.4vw,30px);color:var(--red);margin:0 0 26px;line-height:1.2;}
  .does-k{font-size:11px;font-weight:600;letter-spacing:2.5px;color:#6E727A;margin:0 0 8px;}
  .mdoes{margin:0;max-width:560px;}
  .quiz{margin-top:30px;background:var(--panel);border:1px solid var(--line-dark);border-radius:20px;padding:24px;max-width:600px;}
  .q-label{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;letter-spacing:2px;color:var(--red);}
  .q-label img{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#E7E8EA;}
  .quiz .q{color:#fff;font-size:18px;line-height:1.45;margin:14px 0 16px;}
  .opts{display:grid;gap:10px;}
  .opt{text-align:left;background:#141416;border:1px solid var(--line-dark);border-radius:12px;padding:13px 16px;color:var(--silver);
    font-family:var(--sans);font-size:15px;line-height:1.4;cursor:pointer;transition:border-color .2s,background .2s,transform .2s;}
  .opt:hover:not(:disabled){border-color:rgba(227,47,46,.6);transform:translateX(3px);}
  .opt:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
  .opt:disabled{cursor:default;}
  .opt.is-right{border-color:#5FAE7B;background:rgba(95,174,123,.12);color:#fff;}
  .opt.is-wrong{border-color:var(--red);background:rgba(227,47,46,.10);}
  .verdict{margin-top:16px;font-size:14.5px;line-height:1.6;color:var(--silver);}
  .verdict b{color:var(--red);}
  .verdict.ok b{color:#5FAE7B;}
  .next[hidden],.verdict[hidden],.hear[hidden]{display:none;}
  .next{display:inline-block;margin-top:14px;color:#fff;font-weight:600;font-size:14px;text-decoration:none;border-bottom:1px solid var(--red);}
  .result{max-width:760px;}
  .member,#test,#result{scroll-margin-top:72px;}
  @media (max-width:760px){ #nav .nav-link{display:none;} }
  @media (max-width:860px){
    .mgrid{grid-template-columns:1fr;gap:26px;}
    .member.flip .mfig{order:0;}
    .mfig video{max-width:300px;}
    .member{padding:48px 0;}
  }
  /* ===== THE CONCEPT TEAM ===== */
  .hero-team{display:inline-flex;align-items:center;gap:14px;margin-top:34px;text-decoration:none;color:var(--silver);font-size:14px;font-weight:600;}
  .hero-team .faces{display:flex;}
  .hero-team .faces img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#E8E8E8;border:2px solid #000;margin-left:-11px;transition:transform .35s cubic-bezier(.25,1,.25,1);}
  .hero-team .faces img:first-child{margin-left:0;}
  .hero-team:hover .faces img{transform:translateY(-4px);}
  .hero-team:hover .faces img:nth-child(2){transition-delay:.04s}.hero-team:hover .faces img:nth-child(3){transition-delay:.08s}
  .hero-team:hover .faces img:nth-child(4){transition-delay:.12s}.hero-team:hover .faces img:nth-child(5){transition-delay:.16s}.hero-team:hover .faces img:nth-child(6){transition-delay:.2s}
  .hero-team .arrow{color:var(--red);transition:transform .3s;}
  .hero-team:hover .arrow{transform:translateX(4px);}
  .hero-team:hover span:last-child{color:#fff;}

  #team{position:relative;scroll-margin-top:90px;}
  #team .tstage{margin-top:44px;}
  .team-hook{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;}
  .team-note{margin:0;color:var(--gray);font-size:13px;line-height:1.6;max-width:560px;}
  .team-test{font-size:14px;padding:13px 22px;}
  .team-test span:first-child{font-weight:400;opacity:.9;}
  .ttry{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--red);text-decoration:none;border-bottom:1px solid rgba(227,47,46,.35);}
  .ttry:hover{border-bottom-color:var(--red);}
  #team .team-intro{max-width:760px;}
  .tstage{position:relative;margin-top:46px;background:#000;border-radius:22px;overflow:hidden;display:grid;grid-template-columns:.78fr 1fr 1fr;min-height:560px;color:#fff;}
  .tcopy{position:relative;z-index:2;padding:48px 10px 40px 44px;display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0;}
  .tcopy .ttry{display:inline-block;margin-top:18px;}
  /* the 3D phone (the Concept videos' phone, scene.css) */
  .tphone{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;perspective:1500px;min-width:0;padding:20px 0;}
  .pfloat{animation:pfloat 6s ease-in-out infinite;}
  @keyframes pfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .p3d{position:relative;width:250px;height:520px;transform-style:preserve-3d;transform:rotateY(var(--ry,-20deg)) rotateX(var(--rx,6deg)) rotateZ(var(--rz,0deg));transition:transform 1.3s cubic-bezier(.2,.8,.2,1);}
  .pedge{position:absolute;inset:0;border-radius:40px;background:#15171B;}
  .pedge.rim{background:#3A3E46;}
  .pbody{position:absolute;inset:0;border-radius:40px;background:#0B0C0E;border:1px solid #33363D;box-shadow:0 40px 90px rgba(0,0,0,.7),inset 0 0 0 2px #1C1E23;-webkit-box-reflect:below 18px linear-gradient(transparent 70%,rgba(255,255,255,.07));}
  .pscreen{position:absolute;left:9px;top:9px;right:9px;bottom:9px;border-radius:32px;overflow:hidden;background:#F3F2EF;color:#0A0B0D;display:flex;flex-direction:column;}
  .pisland{position:absolute;left:50%;top:17px;width:74px;height:22px;margin-left:-37px;border-radius:12px;background:#000;}
  .psheen{position:absolute;inset:0;border-radius:40px;pointer-events:none;background:linear-gradient(112deg,transparent 38%,rgba(255,255,255,.10) 50%,transparent 62%);background-size:240% 100%;background-position:var(--sx,50%) 0;mix-blend-mode:screen;transition:background-position 1.3s cubic-bezier(.2,.8,.2,1);}
  .papp{display:flex;align-items:center;gap:9px;padding:46px 14px 10px;border-bottom:1px solid rgba(0,0,0,.07);background:#fff;}
  .papp .pmark{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#E7E8EA;flex:none;}
  .papp b{display:block;font-size:13px;font-weight:600;line-height:1.2;}
  .papp span{display:block;font-size:10.5px;color:#8A8F98;line-height:1.3;}
  .pscreen .tchat{flex:1;justify-content:flex-start;gap:9px;margin:0;padding:14px 11px;max-width:none;overflow:hidden;}
  .pscreen .tmsg{font-size:12.5px;line-height:1.45;padding:10px 12px;border-radius:14px;}
  .pscreen .tmsg .lbl{font-size:8.5px;letter-spacing:1.4px;margin-bottom:4px;gap:6px;}
  .pscreen .tmsg.them .lbl img{width:16px;height:16px;}
  .pbar{padding:8px 0 12px;text-align:center;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:#8A8F98;border-top:1px solid rgba(0,0,0,.06);background:#fff;}
  /* Bia's balloons: one idea through four languages into English (the app's journeys) */
  .bballoon{position:absolute;z-index:4;right:58%;max-width:230px;width:max-content;display:grid;gap:1px;text-align:right;background:#fff;color:#0A0B0D;border-radius:14px 14px 4px 14px;padding:6px 11px 7px;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:bpop .26s cubic-bezier(.2,.8,.2,1) both;transition:opacity .4s,transform .4s;}
  .bballoon .bl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#8A8F98;}
  .bballoon .bt{font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.2;}
  .bballoon.en{box-shadow:0 0 0 1.5px var(--red) inset,0 12px 30px rgba(0,0,0,.45);}
  .bballoon.out{opacity:0;transform:translateY(-6px);}
  @keyframes bpop{from{opacity:0;transform:scale(.6) translateX(14px)}to{opacity:1;transform:none}}
  .tname{font-family:var(--serif);font-size:clamp(40px,4.4vw,60px);line-height:.95;letter-spacing:-.01em;color:#fff;}
  .trole{font-size:11.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--red);}
  .tchat{display:flex;flex-direction:column;gap:12px;margin-top:10px;max-width:470px;}
  .tmsg{border-radius:16px;padding:14px 16px;font-size:15.5px;line-height:1.5;box-shadow:0 10px 28px rgba(0,0,0,.08);opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s cubic-bezier(.25,1,.25,1);}
  .tmsg.on{opacity:1;transform:none;}

var currentLang = "en";
var answers = {};
function t(k){ return window.I18N[currentLang][k]; }
function esc(x){ return String(x).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function buildMembers(){
  var root = document.getElementById('members'), html = '';
  TEAM.forEach(function(m, i){
    var quiz = '';
    if(m.q){
      quiz = '<div class="quiz" data-id="' + m.id + '">' +
        '<div class="q-label"><img src="team/' + m.id + '-face.webp" alt="" width="26" height="26"><span class="ql"></span> ' + esc(m.name) + '</div>' +
        '<p class="q">' + esc(m.q) + '</p><div class="opts">' +
        m.o.map(function(o, k){ return '<button type="button" class="opt" data-k="' + k + '">' + esc(o) + '</button>'; }).join('') +
        '</div><div class="verdict" hidden><b class="vw"></b> <span class="vt"></span></div>' +
        '<a class="next" hidden href="#"></a></div>';
    }
    html += '<section class="member bg-black' + (i % 2 ? ' flip' : '') + '" id="' + m.id + '">' +
      '<div class="wrap mgrid">' +
        '<div class="mfig reveal-scale"><video muted playsinline preload="none" poster="team/' + m.id + '-still.webp?v=4" data-src="team/' + m.id + '.mp4?v=4" width="720" height="1010" aria-hidden="true"></video>' +
        '<button class="hear" type="button" data-id="' + m.id + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="hl"></span></button></div>' +
        '<div class="mcopy reveal">' +
          '<p class="kicker mrole"></p>' +
          '<h2 class="mname">' + esc(m.name) + '</h2>' +
          '<p class="mline">“' + esc(m.line) + '”</p>' +
          '<p class="does-k"></p><p class="body-copy on-dark mdoes"></p>' +
          quiz +
        '</div>' +
      '</div></section>';
  });
  root.innerHTML = html;

  root.querySelectorAll('.quiz').forEach(function(qz){
    var id = qz.getAttribute('data-id'), m = TEAM.filter(function(x){ return x.id === id; })[0];
    qz.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click', function(){
        if(id in answers) return;
        var k = +b.getAttribute('data-k'), ok = k === m.a;
        answers[id] = ok;
        qz.classList.add('done');
        qz.querySelectorAll('.opt').forEach(function(o){
          var kk = +o.getAttribute('data-k');
          if(kk === m.a) o.classList.add('is-right');
          else if(kk === k) o.classList.add('is-wrong');
          o.disabled = true;
        });
        var v = qz.querySelector('.verdict'); v.hidden = false; v.classList.toggle('ok', ok);
        qz.querySelector('.next').hidden = false;
        relabel(); showResult();
      });
    });
    qz.querySelector('.next').addEventListener('click', function(e){
      e.preventDefault();
      var idx = TEAM.indexOf(m), nxt = TEAM[idx + 1];
      var target = document.getElementById(nxt ? nxt.id : 'result');
      target.scrollIntoView({behavior: 'smooth', block: nxt ? 'center' : 'start'});
    });
  });

  /* each member: the scene plays (muted) when on screen; their line plays with
     their voice on Hear, or by itself once the visitor has turned the sound on */
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  TEAM.forEach(function(m){
    var sec = document.getElementById(m.id), v = sec.querySelector('video'), btn = sec.querySelector('.hear');
    var st = {vis: false, spoke: false, mode: ''};
    function scene(){
      st.mode = 'scene'; btn.classList.remove('playing');
      v.muted = true; v.loop = false; v.src = v.getAttribute('data-src');
      if(reduce) return;
      var p = v.play(); if(p && p.catch) p.catch(function(){});
      if(m.id === 'bia') balloons(sec.querySelector('.mfig'));
    }
    function voice(){
      st.mode = 'voice'; st.spoke = true; btn.classList.add('playing');
      sec.querySelectorAll('.bballoon').forEach(function(b){ b.remove(); });
      v.muted = false; v.src = 'team/' + m.voice + '.mp4?v=4';
      var p = v.play(); if(p && p.catch) p.catch(function(){ v.muted = true; scene(); });
    }
    v.addEventListener('ended', function(){ if(st.mode === 'voice' && st.vis) scene(); });
    btn.addEventListener('click', function(){ stopOthers(m.id); voice(); });
    m._stop = function(){ if(!v.paused) v.pause(); btn.classList.remove('playing'); };
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(es){
        st.vis = es[0].isIntersecting;
        if(st.vis){ if(soundOn && !st.spoke){ stopOthers(m.id); voice(); } else if(st.mode !== 'voice') scene(); }
        else { m._stop(); st.mode = ''; }
      }, {threshold: 0.5}).observe(v);
    }
  });
  closingFilm();
}

var soundOn = false;
function stopOthers(id){ TEAM.forEach(function(x){ if(x.id !== id && x._stop) x._stop(); }); var f = document.getElementById('closingFilm'); if(f && !f.paused) f.pause(); }
function paintSound(){
  var b = document.getElementById('soundBtn');
  b.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  document.getElementById('soundTxt').textContent = soundOn ? t('sound_is_on') : t('sound_on');
}
document.getElementById('soundBtn').addEventListener('click', function(){ soundOn = !soundOn; paintSound(); if(soundOn) document.getElementById('netto').scrollIntoView({behavior: 'smooth', block: 'center'}); });

var JOURNEYS = [
  [['Japanese','一石二鳥'],['Chinese','一石二鸟'],['Italian','prendere due piccioni con una fava'],['Portuguese','matar dois coelhos com uma cajadada só'],['English','kill two birds with one stone']],
  [['Japanese','早起きは三文の徳'],['Chinese','早起的鸟儿有虫吃'],['Italian','chi dorme non piglia pesci'],['Portuguese','Deus ajuda quem cedo madruga'],['English','the early bird catches the worm']]
], jn = 0;
function balloons(box){
  box.querySelectorAll('.bballoon').forEach(function(b){ b.remove(); });
  var trip = JOURNEYS[jn++ % JOURNEYS.length];
  trip.forEach(function(st, i){
    setTimeout(function(){
      var b = document.createElement('span');
      b.className = 'bballoon' + (i === trip.length - 1 ? ' en' : '');
      b.style.top = (40 + i * 50) + 'px';
      b.innerHTML = '<span class="bl"></span><span class="bt"></span>';
      b.firstChild.textContent = st[0]; b.lastChild.textContent = st[1];
      box.appendChild(b);
      setTimeout(function(){ b.classList.add('out'); }, 4600 - i * 600);
      setTimeout(function(){ b.remove(); }, 5100 - i * 600);
    }, 3800 + i * 600);
  });
}

/* Netto's closing film: with his voice when the sound is on, otherwise silent with a button */
function closingFilm(){
  var f = document.getElementById('closingFilm'), hb = document.getElementById('closingHear');
  if(!f || !('IntersectionObserver' in window)) return;
  hb.addEventListener('click', function(){ stopOthers(''); hb.hidden = true; f.muted = false; f.currentTime = 0; var p = f.play(); if(p && p.catch) p.catch(function(){}); });
  new IntersectionObserver(function(es){
    if(es[0].isIntersecting){
      if(!f.src) f.src = f.getAttribute('data-src');
      if(f.ended) f.currentTime = 0;
      f.muted = !soundOn; hb.hidden = soundOn;
      if(soundOn) stopOthers('');
      var p = f.play(); if(p && p.catch) p.catch(function(){ f.muted = true; hb.hidden = false; f.play().catch(function(){}); });
    } else if(!f.paused){ f.pause(); }
  }, {threshold: 0.55}).observe(f);
}

function relabel(){
  var d = window.I18N[currentLang];
  TEAM.forEach(function(m){
    var s = document.getElementById(m.id); if(!s) return;
    s.querySelector('.mrole').textContent = d.m[m.id].role.toUpperCase();
    s.querySelector('.does-k').textContent = d.does;
    s.querySelector('.mdoes').textContent = d.m[m.id].does;
    var hl = s.querySelector('.hear .hl'); if(hl) hl.textContent = d.hear + ' ' + m.name;
    var qz = s.querySelector('.quiz'); if(!qz) return;
    qz.querySelector('.ql').textContent = d.q_label;
    if(m.id in answers){
      qz.querySelector('.vw').textContent = answers[m.id] ? d.right : d.wrong;
      qz.querySelector('.vt').textContent = d.m[m.id].why;
    }
    var idx = TEAM.indexOf(m);
    qz.querySelector('.next').textContent = (TEAM[idx + 1] ? d.next + ': ' + TEAM[idx + 1].name : d.to_result) + ' →';
  });
  showResult();
}

function showResult(){
  var n = 0, done = 0;
  for(var k in answers){ done++; if(answers[k]) n++; }
  document.getElementById('resultLine').textContent = done < 5 ? t('result_none') : t('result_line').replace('{n}', n);
}

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  var els = document.querySelectorAll('[data-t]');
  for(var i = 0; i < els.length; i++){
    var v = window.I18N[lang][els[i].getAttribute('data-t')];
    if(typeof v === 'string') els[i].textContent = v;
  }
  var links = {navHome: 'index.html', navMethod: 'method.html', navAbout: 'about.html', navTeam: 'team.html', ctaHome: 'index.html'};
  for(var id in links){ var a = document.getElementById(id); if(a) a.setAttribute('href', links[id] + '?lang=' + lang); }
  document.getElementById('navCta').setAttribute('href', 'index.html?lang=' + lang + '#contact');
  document.getElementById('ctaCall').setAttribute('href', 'index.html?lang=' + lang + '#start');
  var btns = document.querySelectorAll('#langSwitch button');
  for(var b = 0; b < btns.length; b++) btns[b].className = (btns[b].getAttribute('data-lang') === lang) ? 'active' : '';
  relabel();
  paintSound();
  if(window.teamRelabel) window.teamRelabel();
  observeAll();
}

var observer = null;
function observeAll(){
  var els = document.querySelectorAll('.reveal, .reveal-scale');
  if(!('IntersectionObserver' in window)){ for(var i = 0; i < els.length; i++) els[i].classList.add('visible'); return; }
  if(!observer){
    observer = new IntersectionObserver(function(entries){
      for(var i = 0; i < entries.length; i++) if(entries[i].isIntersecting) entries[i].target.classList.add('visible');
    }, {threshold: 0.08});
  }
  for(var j = 0; j < els.length; j++) observer.observe(els[j]);
}

document.querySelectorAll('#langSwitch button').forEach(function(btn){
  btn.addEventListener('click', function(e){ e.preventDefault(); applyLang(btn.getAttribute('data-lang')); });
});

/* ===== THE CONCEPT TEAM: one member at a time, a real question and the answer ===== */
(function(){
  var TEAM = [
    {id:'netto', name:'Netto', ang:[-20,7,-2],
     ask:'Netto, what should I practice this week?',
     ans:'Start with the two mistakes from Tuesday’s lesson. They came back twice in your writing. Then one short review, five minutes.'},

    {id:'luana', name:'Luana', ang:[-30,9,1],
     ask:'Luana, is this right? “I work here since 2019.”',
     ans:'Use the present perfect: <span class="q">“I have worked here since 2019.”</span> It started in the past and it is still true.'},
    {id:'bia', name:'Bia', ang:[24,4,-3],

    {id:'murillo', name:'Murillo', ang:[-12,12,2],
     ask:'Murillo, how do I say “comfortable”?',
     ans:'Three syllables, not four: <span class="q">/\u02c8k\u028cmft\u025ab\u0259l/</span>, COMF-ter-bul. The stress is on the first syllable. Listen, then say it with me.'},
    {id:'marcelo', name:'Marcelo', ang:[28,7,0],
     ask:'Marcelo, where does “salary” come from?',
     ans:'From the Latin <span class="q">salarium</span>, from <span class="q">sal</span>, “salt”. Nobody knows for sure why. The story that Roman soldiers were paid in salt is not proven.'}
  ];
  var DUR = 11000;
  var stage = document.getElementById('tStage'); if(!stage) return;
  var tabs = document.getElementById('tTabs');
  var fig = document.getElementById('tFig');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cur = -1, timer = null, seq = [], visible = false, started = false;

  function L(k){ try{ return window.I18N[currentLang][k] || window.I18N.en[k] || ''; }catch(e){ return ''; } }
  function clearSeq(){ seq.forEach(clearTimeout); seq = []; }
  function later(fn, ms){ seq.push(setTimeout(fn, ms)); }

  TEAM.forEach(function(m, i){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'ttab'; b.setAttribute('role','tab');
    b.innerHTML = '<img src="team/'+m.id+'-face.webp" alt="" width="34" height="34"><span>'+m.name+'</span><i class="bar"></i>';
    b.addEventListener('click', function(){ show(i, true); });
    tabs.appendChild(b);
  });
  tabs.style.setProperty('--dur', DUR + 'ms');
  fig.addEventListener('canplay', function(){ if(!reduce && visible && fig.paused && fig.currentTime === 0){ var p = fig.play(); if(p && p.catch) p.catch(function(){}); } });

  function preload(i){ var l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = 'team/'+TEAM[i].id+'-still.webp?v=4'; document.head.appendChild(l); }

  function typeInto(el, text, done){
    if(reduce){ el.textContent = text; done(); return; }
    var n = 0; el.innerHTML = '<span></span><i class="caret"></i>';
    var span = el.firstChild;
    (function step(){
      n += 2; span.textContent = text.slice(0, n);
      if(n < text.length) later(step, 28); else { el.textContent = text; done(); }
    })();
  }

  function fill(i){
    var m = TEAM[i];
    document.getElementById('tName').textContent = m.name;
    document.getElementById('tRole').textContent = L('role_' + m.id);
    document.getElementById('tAnsWho').textContent = m.name;
    document.getElementById('tAnsFace').src = 'team/'+m.id+'-face.webp';
    document.getElementById('tAppFace').src = 'team/'+m.id+'-face.webp';
    document.getElementById('tAppName').textContent = m.name;
    document.getElementById('tAppRole').textContent = L('role_' + m.id);
    var ph = document.getElementById('tPhone'), k = window.innerWidth < 900 ? 0.55 : 1;
    ph.style.setProperty('--ry', (m.ang[0] * k) + 'deg'); ph.style.setProperty('--rx', (m.ang[1] * k) + 'deg'); ph.style.setProperty('--rz', (m.ang[2] * k) + 'deg');
    ph.querySelector('.psheen').style.setProperty('--sx', Math.round((m.ang[0] + 32) / 64 * 100) + '%');
    if(m.id === 'bia') later(balloons, reduce ? 0 : 3800);
    var tr = document.getElementById('tTry'); tr.hidden = true;
    tr.href = '#' + (m.id === 'netto' ? 'test' : m.id);
    tr.textContent = (m.id === 'netto' ? L('team_meet_all') : L('team_try') + ' ' + m.name) + ' \u2192';
    var ask = document.getElementById('tAsk'), ans = document.getElementById('tAns');
    var askT = document.getElementById('tAskText'), ansT = document.getElementById('tAnsText');
    ask.classList.remove('on'); ans.classList.remove('on'); askT.textContent = ''; ansT.innerHTML = '';
    fig.poster = 'team/'+m.id+'-still.webp?v=4';
    if(!reduce){
      fig.src = 'team/'+m.id+'.mp4?v=4';
      var pr = fig.play(); if(pr && pr.catch) pr.catch(function(){});
    } else { fig.removeAttribute('src'); }
    later(function(){ ask.classList.add('on'); typeInto(askT, m.ask, function(){
      later(function(){ ans.classList.add('on'); ansT.innerHTML = '<span class="tdots"><i></i><i></i><i></i></span>'; }, 350);
      later(function(){ ansT.innerHTML = m.ans; document.getElementById('tTry').hidden = false; }, reduce ? 0 : 1500);
    }); }, reduce ? 0 : 450);
  }

  var JOURNEYS = [
    [['Japanese','\u4e00\u77f3\u4e8c\u9ce5'],['Chinese','\u4e00\u77f3\u4e8c\u9e1f'],['Italian','prendere due piccioni con una fava'],['Portuguese','matar dois coelhos com uma cajadada s\u00f3'],['English','kill two birds with one stone']],
    [['Japanese','\u65e9\u8d77\u304d\u306f\u4e09\u6587\u306e\u5fb3'],['Chinese','\u65e9\u8d77\u7684\u9e1f\u513f\u6709\u866b\u5403'],['Italian','chi dorme non piglia pesci'],['Portuguese','Deus ajuda quem cedo madruga'],['English','the early bird catches the worm']]
  ], jn = 0;
  function balloons(){
    var box = fig.parentNode; box.querySelectorAll('.bballoon').forEach(function(b){ b.remove(); });
    if(reduce) return;
    var trip = JOURNEYS[jn++ % JOURNEYS.length], top0 = window.innerWidth < 900 ? 10 : 70;

      later(function(){
        var b = document.createElement('span');
        b.className = 'bballoon' + (i === trip.length - 1 ? ' en' : '');
        b.style.top = (top0 + i * 50) + 'px';
        b.innerHTML = '<span class="bl"></span><span class="bt"></span>';
        b.firstChild.textContent = st[0]; b.lastChild.textContent = st[1];
        box.appendChild(b);
        later(function(){ b.classList.add('out'); }, 4600 - i * 600);
        later(function(){ b.remove(); }, 5100 - i * 600);
      }, i * 600);
    });
  }
  function show(i, byHand){
    clearSeq(); clearTimeout(timer);
    fig.parentNode.querySelectorAll('.bballoon').forEach(function(b){ b.remove(); });
    var first = cur === -1;
    cur = i;
    [].forEach.call(tabs.children, function(b, k){
      b.classList.remove('on'); void b.offsetWidth;
      if(k === i){ b.classList.add('on'); b.setAttribute('aria-selected','true'); } else b.setAttribute('aria-selected','false');
    });

    if(first || reduce){ fill(i); }

  }
  function schedule(){
    clearTimeout(timer);
    if(reduce || !visible || document.hidden){ tabs.classList.add('paused'); return; }
    tabs.classList.remove('paused');
    timer = setTimeout(function(){ show((cur + 1) % TEAM.length); }, DUR);
  }

  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){
      visible = es[0].isIntersecting;
      if(visible && !started){ started = true; show(0); }
      else if(visible){ show(cur); }
      else { clearTimeout(timer); tabs.classList.add('paused'); }
    }, {threshold:0.35}).observe(stage);
  } else { visible = true; started = true; show(0); }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && visible) show(cur); else { clearTimeout(timer); tabs.classList.add('paused'); } });

  window.teamRelabel = function(){

  };
})();
