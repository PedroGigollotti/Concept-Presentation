<script>
const PF_DATA=[{"dir": "unit44", "unit": {"n": 44, "level": "C2", "eyebrow": "Part Four · Music and delivery", "title": "Sounding the way you intend to sound", "why": "The last unit, and the one that ties the rest together. Your voice carries your attitude and your confidence whether you manage it or not. Two people can say identical words and be heard as warm or cold, certain or hesitant, senior or junior. The words are not doing that work. Four things are: pitch range, pace, pause, and voice quality. You do not need to control all four perfectly. You need to know they exist and notice when yours is working against you.", "trap": "Pace is the most common problem, and not the one people expect. Non-native speakers usually speak too fast, not too slow, and it is almost always nerves. Speed reads as anxiety, and it removes the pauses your listener needs. Silence tolerance is cultural: if your culture treats a pause as awkward, you will fill it, and filling pauses is exactly what makes speech sound anxious.", "about": "", "listen": "", "access": {"intro": "This is the capstone, and the work is in your own delivery, so there is no quiz. First hear two things the frame does. Then you will record and check your own.", "demos": [{"id": "u44-pause-d", "A": "What is the headline here?", "B": "Remember this: we doubled revenue.", "focus": "doubled", "weak": [], "arrow": "fall", "caption": "Notice the pause before the point. A pause before something important makes the room lean in, and a pause after it lets the point land. Most people rush through the silence and lose both effects.", "audio": "u44-pause-d.mp3"}, {"id": "u44-ending-d", "A": "So where did we land?", "B": "That's the decision.", "focus": "decision", "weak": [], "arrow": "fall", "caption": "A firm, falling ending. The voice does not trail off into a creaky, breathy tail, and it does not tick up like a question. Either of those undercuts everything you just said.", "audio": "u44-ending-d.mp3"}]}, "activation": {"intro": "Now make the frame yourself. Take each line slower than feels natural, put real silence where the note says, and end firmly. Record, then compare your shape with the model.", "tasks": [{"prompt": "Put a real pause after this, then deliver the number and let it land. Do not rush the silence.", "say": "Remember this: we doubled revenue.", "focus": "doubled", "weak": [], "arrow": "fall", "model": "u44-say-pause.mp3"}, {"prompt": "End firmly. Let the voice fall and stop. Do not trail off, and do not rise.", "say": "That's the decision.", "focus": "decision", "weak": [], "arrow": "fall", "model": "u44-say-ending.mp3"}, {"prompt": "Slower than feels natural. Nerves speed you up, so deliberately slow this down.", "say": "Let me walk you through the three options.", "focus": "options", "weak": [], "arrow": "", "model": "u44-say-pace.mp3"}]}}, "lesson": []}];
const audio=document.getElementById("audio");
function play(fn,dir){audio.src="pf-audio/"+dir+"/"+fn;audio.currentTime=0;audio.play();}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
// build the focus zoom: B's line with the focus word enlarged, weak words dimmed,
// and a fall/rise arrow next to the focus word when the point is a tune.
function zoomLine(text,focusW,weakW,arrowKind,label){
  const arrow=arrowKind==="fall"?"&#8600;":(arrowKind==="rise"?"&#8599;":(arrowKind==="fallrise"?"&#8600;&#8599;":""));
  const focus=(focusW||"").toLowerCase();
  const weak=(weakW||[]).map(w=>w.toLowerCase());
  const toks=text.split(" ").map(tok=>{
    const bare=tok.replace(/[^A-Za-z']/g,"").toLowerCase();
    if(bare && bare===focus)
      return '<span class="tok fw">'+esc(tok)+(arrow?'<span class="arrow">'+arrow+'</span>':'')+'</span>';
    if(weak.indexOf(bare)>=0) return '<span class="tok wk">'+esc(tok)+'</span>';
    return '<span class="tok">'+esc(tok)+'</span>';
  });
  return '<div class="zoom"><span class="zlabel">'+label+'</span>'+toks.join(" ")+'</div>';
}
function zoom(it){return zoomLine(it.B,it.focus,it.weak,it.arrow,"Where to listen");}
// --- shape math, ported from the book's Record-and-compare so Part Four matches it ---
function pathFor(p,c,w,f){if(!p||!p.length)return"";const n=p.length,mid=140,amp=118;let u="",d="";
  p.forEach((v,i)=>{const x=(i/(n-1))*1000,y=Math.max(1,v*amp);u+=(i?"L":"M")+x.toFixed(1)+","+(mid-y).toFixed(1);});
  for(let i=n-1;i>=0;i--){const x=(i/(n-1))*1000,y=Math.max(1,p[i]*amp);d+="L"+x.toFixed(1)+","+(mid+y).toFixed(1);}
  return '<path d="'+u+d+'Z" fill="'+(f||"none")+'" stroke="'+c+'" stroke-width="'+w+'"/>';}
function drawWave(svg,mp,yp){let s='<line x1="0" y1="140" x2="1000" y2="140" stroke="#2a2e34" stroke-width="1"/>';
  if(mp)s+=pathFor(mp,"#8b9098",1.5,"rgba(139,144,152,.22)");
  if(yp)s+=pathFor(yp,"#B3132B",2,"rgba(179,19,43,.20)");svg.innerHTML=s;}
async function peaksOf(blob,n){const buf=await blob.arrayBuffer();
  const ac=new(window.AudioContext||window.webkitAudioContext)();const ab=await ac.decodeAudioData(buf);
  const d=ab.getChannelData(0),st=Math.floor(d.length/n)||1,o=[];
  for(let i=0;i<n;i++){let m=0;for(let j=i*st;j<(i+1)*st&&j<d.length;j++){const v=Math.abs(d[j]);if(v>m)m=v;}o.push(m);}
  const mx=Math.max(...o)||1;ac.close();return o.map(v=>+(v/mx).toFixed(3));}
function simShape(a,b){if(!a||!b||!a.length||!b.length)return 0;const n=Math.min(a.length,b.length);
  let d=0,na=0,nb=0;for(let i=0;i<n;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return d/(Math.sqrt(na*nb)||1);}
function actCard(t){
  return '<div class="act" data-model="'+t.model+'">'
    +'<div class="prompt">'+t.prompt+'</div>'
    +zoomLine(t.say,t.focus,t.weak,t.arrow,"Say this, match the music")
    +'<div class="lane"><svg class="wave" viewBox="0 0 1000 280" preserveAspectRatio="none"></svg>'
    +'<div class="legend"><span><i class="lg-m"></i>Model</span><span><i class="lg-y"></i>You</span></div></div>'
    +'<div class="recrow"><button class="rec"><span class="recdot"></span>Record</button>'
    +'<button class="ghost pmodel">Play model</button>'
    +'<button class="ghost pmine" disabled>Play mine</button>'
    +'<span class="recstat">Play the model, then record yourself.</span></div></div>';
}
function wireActivation(container,dir){
  container.querySelectorAll(".act").forEach(card=>{
    const recBtn=card.querySelector(".rec"),stat=card.querySelector(".recstat"),
          svg=card.querySelector(".wave"),pmine=card.querySelector(".pmine"),
          pmodel=card.querySelector(".pmodel");
    let mr=null,chunks=[],url=null,stream=null,on=false,modelPeaks=null,minePeaks=null;
    async function ensureModel(){
      if(modelPeaks)return modelPeaks;
      try{const r=await fetch("pf-audio/"+dir+"/"+card.dataset.model);
        modelPeaks=await peaksOf(await r.blob(),48);}catch(e){}
      return modelPeaks;}
    // draw the target shape up front so the student sees what to aim at
    ensureModel().then(()=>drawWave(svg,modelPeaks,minePeaks));
    pmodel.onclick=()=>play(card.dataset.model,dir);
    pmine.onclick=()=>{if(url)new Audio(url).play();};
    recBtn.onclick=async()=>{
      if(!on){
        try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
        catch(e){stat.textContent="Microphone blocked. Allow access and reload, or compare by ear.";return;}
        chunks=[];mr=new MediaRecorder(stream);
        mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
        mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());
          if(url)URL.revokeObjectURL(url);
          const blob=new Blob(chunks,{type:mr.mimeType});url=URL.createObjectURL(blob);
          minePeaks=await peaksOf(blob,48);await ensureModel();drawWave(svg,modelPeaks,minePeaks);
          pmine.disabled=false;
          const sc=simShape(modelPeaks,minePeaks);
          stat.innerHTML=sc>0.85?'<b style="color:var(--ok)">Close shape. That is the delivery.</b>'
            :"Compare the shapes, then record again.";};
        mr.start();on=true;recBtn.classList.add("recording");
        recBtn.innerHTML='<span class="recdot"></span>Stop';stat.textContent="Recording. Say it once, then stop.";
      }else{
        mr.stop();on=false;recBtn.classList.remove("recording");
        recBtn.innerHTML='<span class="recdot"></span>Record again';
      }
    };
  });
}
Promise.resolve(PF_DATA).then(data=>{
  const nav=document.getElementById("nav"),host=document.getElementById("units");
  data.forEach(d=>{
    const u=d.unit, dir=d.dir;
    const a=document.createElement("a");a.href="#"+dir;a.textContent="Unit "+u.n+": "+u.title;nav.appendChild(a);
    const art=document.createElement("article");art.className="unit";art.id=dir;
    // ACCESS: the worked model. Play it and see the focus openly, before any practice.
    let accessHTML="";
    if(u.access){
      accessHTML='<div class="phase"><span class="pa pa-acc">Access</span><span class="pt">Hear how it works</span></div>'
        +'<p class="access-intro">'+u.access.intro+'</p>';
      u.access.demos.forEach(dm=>{
        accessHTML+='<div class="demo"><div class="badge">Model</div>'
          +'<div class="dialog"><p class="line a"><span class="who">A</span>'+dm.A+'</p>'
          +'<p class="line b"><span class="who">B</span><span class="btext">'+dm.B+'</span></p></div>'
          +'<button class="play" data-a="'+dm.audio+'">&#9654;&nbsp; Hear it</button>'
          +zoom(dm)
          +'<div class="caption">'+dm.caption+'</div></div>';
      });
    }
    art.innerHTML='<p class="eyebrow">'+u.eyebrow+'</p>'
      +'<div class="unum">Unit '+u.n+' &middot; '+u.level+'</div>'
      +'<h1>'+u.title+'</h1>'
      +'<div class="sech">Why it matters</div><p class="why-it">'+u.why+'</p>'
      +'<div class="trap"><span class="tlbl">The trap</span><span>'+u.trap+'</span></div>'
      +accessHTML
      // Analysis phase only appears when the unit has quiz items. Production-first
      // sound units (no items) go straight from Access to Activation.
      +(d.lesson.length
        ? '<div class="phase"><span class="pa pa-ana">Analysis</span><span class="pt">Train your ear</span></div>'
          +'<p class="about">'+u.about+'</p>'
          +'<div class="listen"><span class="ic">&#9654;</span><span>'+u.listen+'</span></div>'
        : '');
    // wire the model play buttons now that the markup is committed once
    art.querySelectorAll(".demo .play").forEach(b=>b.onclick=()=>play(b.dataset.a,dir));
    d.lesson.forEach(it=>{
      const sec=document.createElement("section");sec.className="ex";
      let opts=it.options.map((t,i)=>'<div class="opt" data-i="'+i+'"><span class="dot"></span><span>'+t+'</span></div>').join("");
      sec.innerHTML='<div class="dialog"><p class="line a"><span class="who">A</span>'+it.A+'</p>'
        +'<p class="line b"><span class="who">B</span><span class="btext">'+(it.show||it.B)+'</span>'
        +'<span class="cue">answer about this line</span></p></div>'
        +'<button class="play">&#9654;&nbsp; Hear it</button>'
        +'<div class="q">'+it.question+'</div><div class="opts">'+opts+'</div>'
        +'<button class="check">Check</button><div class="reveal"></div>';
      art.appendChild(sec);
      let pick=null;
      sec.querySelector(".play").onclick=()=>play(it.audio,dir);
      const optEls=[...sec.querySelectorAll(".opt")];
      optEls.forEach(o=>o.onclick=()=>{if(sec.querySelector(".reveal").classList.contains("show"))return;
        pick=+o.dataset.i;optEls.forEach(x=>x.classList.remove("sel"));o.classList.add("sel");});
      sec.querySelector(".check").onclick=()=>{
        if(pick===null)return;
        optEls.forEach((o,i)=>{o.classList.remove("sel");if(i===it.correct)o.classList.add("correct");
