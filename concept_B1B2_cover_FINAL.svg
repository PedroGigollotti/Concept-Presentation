<svg viewBox="0 0 440 640" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Carlito, Arial, sans-serif">
  <defs>
    <linearGradient id="platinum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7E8EA"/>
      <stop offset="50%" stop-color="#7C7F84"/>
      <stop offset="100%" stop-color="#E7E8EA"/>
    </linearGradient>
  </defs>

  <g transform="translate(20,20)">
    <rect x="0" y="0" width="400" height="600" rx="10" fill="#0A0B0D" stroke="#1A1A1A" stroke-width="1"/>

    <!-- compact imprint gauge mark, top-left -->
    <g transform="translate(-24,14) scale(0.25)">
      <path d="M 580.95,351.30 A 150 150 0 1 1 580.95,248.70" fill="none" stroke="url(#platinum)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="440" cy="300" r="11" fill="#E7E8EA"/>
      <polygon points="562.87,213.96 448.03,311.47 431.97,288.53" fill="#B3132B"/>
      <circle cx="562.87" cy="213.96" r="7" fill="#B3132B"/>
    </g>

    <!-- level badge -->
    <text x="372" y="58" text-anchor="end" fill="#6E6E6E" font-size="11" letter-spacing="3">CEFR LEVEL</text>
    <text x="374" y="101" text-anchor="end" font-family="Georgia, serif" font-weight="bold" fill="#B3132B" font-size="34">B1-B2</text>

    <!-- dominant hero hook, left-aligned -->
    <text x="36" y="214" font-family="Georgia, serif" font-size="64" fill="#E7E8EA">It's not</text>
    <text x="36" y="286" font-family="Georgia, serif" font-size="72" font-style="italic" fill="#B3132B">only</text>
    <text x="36" y="356" font-family="Georgia, serif" font-size="64" fill="#E7E8EA">a grammar</text>
    <text x="36" y="426" font-family="Georgia, serif" font-size="64" fill="#E7E8EA">book.</text>

    <line x1="38" y1="454" x2="248" y2="454" stroke="#B3132B" stroke-width="2.5"/>

    <!-- descriptive title, second plane -->
    <text x="38" y="482" fill="#7C7F84" font-size="13" letter-spacing="4">ENGLISH COMMUNICATION</text>
    <text x="38" y="502" fill="#7C7F84" font-size="13" letter-spacing="4">FOR PROFESSIONALS</text>

    <!-- author + imprint, small -->
    <text x="38" y="556" fill="#8A8D92" font-size="10" letter-spacing="1">By Pedro Gigollotti Netto</text>
    <text x="38" y="573" fill="#5E6166" font-size="8.5" letter-spacing="3">CONCEPT   ·   MIND YOUR FUTURE</text>
  </g>
</svg>
