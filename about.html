  .needle{transform-origin:200px 200px;animation:tickTock 60s steps(60) infinite;}

var currentLang = "en";
function t(k){ return window.I18N[currentLang][k]; }

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  var els = document.querySelectorAll('[data-t]');
  for(var i=0;i<els.length;i++){
    var v = window.I18N[lang][els[i].getAttribute('data-t')];
    if(typeof v === 'string') els[i].textContent = v;
  }
  document.getElementById('navHome').textContent = t('nav_home');
  document.getElementById('navHome').setAttribute('href', 'index.html?lang=' + lang);
  document.getElementById('navCta').textContent = t('nav_cta');
  document.getElementById('navCta').setAttribute('href', 'index.html?lang=' + lang + '#contact');
  document.getElementById('ctaContact').textContent = t('ctaContact');
  document.getElementById('ctaContact').setAttribute('href', 'index.html?lang=' + lang + '#contact');
  var nm = document.getElementById('navMethod');
        if(nm){ nm.textContent = t('nav_method'); nm.setAttribute('href','method.html?lang=' + lang); }
        var nl = document.getElementById('navLessons');
  if(nl){ nl.textContent = t('nav_lessons'); }
        var nb = document.getElementById('navBook');
        if(nb){ nb.textContent = t('nav_book'); }
        document.getElementById('ctaMethod').textContent = t('ctaMethod');
  document.getElementById('ctaMethod').setAttribute('href', 'method.html?lang=' + lang);

  var btns = document.querySelectorAll('#langSwitch button');
  for(var b=0;b<btns.length;b++){
    btns[b].className = (btns[b].getAttribute('data-lang')===lang) ? 'active' : '';
  }
  observeAll();
}

var observer = null;
function observeAll(){
  var els = document.querySelectorAll('.reveal, .reveal-scale');
  if(!('IntersectionObserver' in window)){
    for(var i=0;i<els.length;i++) els[i].classList.add('visible');
    return;
  }
  if(!observer){
    observer = new IntersectionObserver(function(entries){
      for(var i=0;i<entries.length;i++){
        if(entries[i].isIntersecting) entries[i].target.classList.add('visible');
      }
    }, {threshold:0.08});
  }
  for(var j=0;j<els.length;j++) observer.observe(els[j]);
}

var sw = document.querySelectorAll('#langSwitch button');
for(var s=0; s<sw.length; s++){
  (function(btn){
    btn.addEventListener('click', function(e){
      e.preventDefault();
      applyLang(btn.getAttribute('data-lang'));
    });
  })(sw[s]);
}

var urlParams = new URLSearchParams(window.location.search);
var langParam = urlParams.get('lang');
applyLang(langParam && window.I18N[langParam] ? langParam : 'en');
</script>
